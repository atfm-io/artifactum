# `pip install atfm` installs Artifactum. This package has no code of its own; it holds the
# name, so it can't be taken by someone else, and brings in the real package.
[project]
name = "atfm"
version = "1.0.0"
description = "Installs artifactum, the registry and lineage tracker for data files (the atfm command)"
readme = "README.md"
license = "MIT"
authors = [{name = "Chris Cole", email = "chris.c.1221@gmail.com"}]
requires-python = ">= 3.10"
dependencies = ["artifactum"]

[project.urls]
Homepage = "https://atfm.io"
Repository = "https://github.com/atfm-io/artifactum"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
bypass-selection = true  # no modules: the wheel only declares the dependency

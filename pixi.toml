# Development environment for the Artifactum client.
[workspace]
name = "artifactum"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"
pytest = ">=8.0"

[pypi-dependencies]
artifactum = { path = ".", editable = true }

[tasks]
test = "pytest tests/ -v"

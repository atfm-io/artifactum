[project]
name = "artifactum"
version = "0.1.0"
description = "A registry and lineage tracker for the files data teams produce"
readme = "README.md"
authors = [{name = "Chris Cole", email = "chris.c.1221@gmail.com"}]
requires-python = ">= 3.11"
dependencies = [
    "httpx>=0.27",
    "jsonargparse>=4.35",
    "rich>=13.0",
    "google-cloud-storage>=2.0",
    "textual>=0.70",
    "tomli-w>=1.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://atfm.io"
Repository = "https://github.com/atfm-io/artifactum"
Issues = "https://github.com/atfm-io/artifactum/issues"

[project.scripts]
artifactum = "artifactum.cli.main:main"
# Short alias for everyday use
atfm = "artifactum.cli.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/artifactum"]

# ── Development environment (pixi) ───────────────────────────────────────────────

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
artifactum = { path = ".", editable = true, extras = ["test"] }

[tool.pixi.tasks]
test = "pytest"

# ── Tests and coverage ───────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["artifactum"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[project]
name = "artifactum"
version = "0.3.0"
description = "A registry and lineage tracker for the files data teams produce"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chris Cole", email = "chris.c.1221@gmail.com"}]
requires-python = ">= 3.10"
keywords = ["data lineage", "provenance", "artifacts", "reproducibility", "data versioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27",
    "jsonargparse>=4.35",
    "rich>=13.0",
    "textual>=0.70",
    "tomli-w>=1.0",
    "pyperclip>=1.8",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Storing files in a Google Cloud Storage bucket (a shared directory needs nothing extra)
gcs = ["google-cloud-storage>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "pre-commit>=3.5"]

[project.urls]
Homepage = "https://atfm.io"
Repository = "https://github.com/atfm-io/artifactum"
Issues = "https://github.com/atfm-io/artifactum/issues"

[project.scripts]
atfm = "artifactum.cli.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/artifactum"]

# The source archive is the package, its tests and docs; not the dev tooling
[tool.hatch.build.targets.sdist]
include = ["src/artifactum", "tests", "LICENSE", "README.md", "CHANGELOG.md", "CONTRIBUTING.md"]

# ── Development environment (pixi) ───────────────────────────────────────────────

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
artifactum = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
test = "pytest"
# Format and fix what can be fixed automatically, then report the rest
fmt = "ruff format && ruff check --fix"
# What CI runs: fails on unformatted code or lint errors, changes nothing
lint = "ruff format --check && ruff check"
# Run ruff automatically on every commit (once per clone)
install-hooks = "pre-commit install"

# ── Code style ───────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports and variables, undefined names
    "I",       # import order
    "UP",      # modern syntax for the supported Python versions
    "B",       # likely bugs (bugbear)
    "SIM",     # simpler equivalents
]

# ── Tests and coverage ───────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["artifactum"]
branch = true

[tool.coverage.report]
# CI fails if coverage drops below this (91% when it was set)
fail_under = 85
skip_covered = true
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one failure shouldn't hide how the other combinations fare
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Coverage is reported by pytest-cov (settings in pyproject.toml)
      - run: pytest -v --cov-report=xml
      # One upload is enough for the badge; the CODECOV_SECRET secret is the upload token from codecov.io
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          token: ${{ secrets.CODECOV_SECRET }}
          files: coverage.xml
          fail_ci_if_error: false

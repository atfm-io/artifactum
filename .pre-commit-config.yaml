# Runs ruff on staged files before each commit. Set up once with: pixi run install-hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4  # keep in step with the ruff version pixi installs
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
